name: Build

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: '同时生成并上传安装版 EXE 与绿色免安装 ZIP'
        required: false
        type: boolean
        default: true

jobs:
  build:
    uses: ./.github/workflows/build-app.yml
    with:
      skip_flasher: true
      uv_sync_mode: "locked"
      obfuscate: false
      build_installer: ${{ github.event_name == 'workflow_dispatch' && inputs.package_artifacts }}
      upload_artifact: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.package_artifacts) }}
