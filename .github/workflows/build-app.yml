name: Build Application

on:
  workflow_call:
    outputs:
      artifact_run_id:
        description: 'Workflow run ID that uploaded the build artifact'
        value: ${{ jobs.build.outputs.artifact_run_id }}
    inputs:
      skip_flasher:
        type: boolean
        default: false
        description: '跳过 epass_flasher/bin 检查'
      build_installer:
        type: boolean
        default: false
        description: '生成 Inno Setup 安装程序（Release 与手动产物构建时启用）'
      upload_artifact:
        type: boolean
        default: false
        description: '上传安装版与绿色免安装版产物（Release 与手动产物构建时启用）'
      obfuscate:
        type: boolean
        default: false
        description: 'Use PyArmor to obfuscate first-party Python sources'
      uv_sync_mode:
        type: string
        default: "locked"
        description: 'uv sync 模式: "locked"（严格校验锁文件）或 "frozen"（跳过校验）'
      version_override:
        type: string
        default: ""
        description: '非空时在构建前同步版本号到各配置文件'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact_run_id: ${{ steps.expose-run-id.outputs.artifact_run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # 常规 CI 使用 --skip-flasher，不需要拉取体积较大的 flasher 子模块。
          # Release 会显式传入 false，因此仍会取得完整发布内容。
          submodules: ${{ inputs.skip_flasher == false }}

      # ========== 可选：版本同步（仅 release 时传入） ==========

      - name: Sync version to build files
        if: inputs.version_override != ''
        shell: pwsh
        run: |
          $version = "${{ inputs.version_override }}"
          Write-Host "Syncing version to $version"

          # Update installer.iss
          $installerIss = Get-Content installer.iss -Raw
          $installerIss = $installerIss -replace '#define MyAppVersion "[^"]+"', "#define MyAppVersion `"$version`""
          Set-Content installer.iss $installerIss -NoNewline
          Write-Host "Updated installer.iss"

          # Update config/constants.py (运行时版本显示)
          $constantsPy = Get-Content config/constants.py -Raw
          $constantsPy = $constantsPy -replace 'APP_VERSION = "[^"]+"', "APP_VERSION = `"$version`""
          Set-Content config/constants.py $constantsPy -NoNewline
          Write-Host "Updated config/constants.py"

          # Update pyproject.toml (包元数据)
          $pyprojectToml = Get-Content pyproject.toml -Raw
          $pyprojectToml = $pyprojectToml -replace '(?m)^version = "[^"]+"', "version = `"$version`""
          Set-Content pyproject.toml $pyprojectToml -NoNewline
          Write-Host "Updated pyproject.toml"

          # Update simulator/Cargo.toml (Rust 模拟器版本)
          $cargoToml = Get-Content simulator/Cargo.toml -Raw
          $cargoToml = $cargoToml -replace '(?m)^version = "[^"]+"', "version = `"$version`""
          Set-Content simulator/Cargo.toml $cargoToml -NoNewline
          Write-Host "Updated simulator/Cargo.toml"

      # ========== Rust 模拟器编译 ==========

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "simulator -> target"

      - name: Build Rust Simulator
        shell: pwsh
        run: |
          cd simulator
          cargo fmt --check
          cargo test
          cargo build --release --locked
          if (Test-Path "target\release\arknights_pass_simulator.exe") {
            Write-Host "Simulator built successfully"
          } else {
            Write-Error "Simulator build failed!"
            exit 1
          }

      # ========== Python 应用编译 ==========

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 是进程内 VapourSynth 的下限（捆绑 wheel 为 cp312-abi3）
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.10"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ inputs.uv_sync_mode }}" = "frozen" ]; then
            uv sync --frozen
          else
            uv sync --locked
          fi
          if [ "${{ inputs.obfuscate }}" = "true" ]; then
            uv pip install "pyarmor>=8,<9"
          fi
          uv run --no-sync python -c "import OpenGL, cv2, PyQt6, numpy, requests; import core.rndis_device_service, core.http_remote_service, gui.workers.rndis_http_workers; print('All packages OK')"

      - name: Cache media tools
        uses: actions/cache@v4
        id: cache-media-tools
        with:
          path: media-tools-v1.0.7z
          key: media-tools-v1.0.7z

      - name: Download media tools on cache miss
        if: steps.cache-media-tools.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "Cache miss — downloading media tools from repository release..."
          $repo = "${{ github.repository }}"
          $tag = "media-tools-v1.0"
          $asset = "media-tools-v1.0.7z"
          $url = "https://github.com/$repo/releases/download/$tag/$asset"

          Write-Host "Downloading from: $url"
          try {
            Invoke-WebRequest -Uri $url -OutFile media-tools-v1.0.7z -MaximumRetryCount 3
            $fileSize = (Get-Item media-tools-v1.0.7z).Length / 1MB
            Write-Host "✓ Downloaded successfully: $($fileSize.ToString('F2')) MB"
          } catch {
            Write-Error "Failed to download media tools: $_"
            Write-Host "URL attempted: $url"
            Write-Host ""
            Write-Host "请先创建 release 并上传文件："
            Write-Host "1. 访问 https://github.com/$repo/releases/new"
            Write-Host "2. Tag: media-tools-v1.0"
            Write-Host "3. 上传 media-tools-v1.0.7z"
            exit 1
          }

      - name: Extract media tools
        shell: pwsh
        run: |
          if (-not (Test-Path "media-tools-v1.0.7z")) {
            Write-Error "Archive not found after cache restore/download"
            exit 1
          }

          Write-Host "Extracting media tools..."
          7z x media-tools-v1.0.7z -y

          # Verify critical binaries exist
          # Preview + export both run through VapourSynth now. The plugin
          # autoload anchors on the directory of the loaded VapourSynth.dll and
          # is gated by the `portable.vs` marker, so a missing marker or plugin
          # degrades SILENTLY to "no plugins" at runtime — fail the build here.
          $requiredTools = @(
            "VSPipe.exe", "x264-7mod.exe",
            "vapoursynth.pyd", "vapoursynth.dll", "portable.vs",
            "vs-plugins/LSMASHSource.dll", "vs-plugins/libimwri.dll"
          )
          foreach ($tool in $requiredTools) {
            $path = "tools/media/$tool"
            if (-not (Test-Path $path)) {
              Write-Error "Required tool not found: $path"
              exit 1
            }
            Write-Host "✓ Found: $path"
          }

          $totalSize = (Get-ChildItem tools/media -Recurse | Measure-Object Length -Sum).Sum / 1MB
          Write-Host "Media tools extracted successfully ($($totalSize.ToString('F2')) MB)"

      # M3 worker tests intentionally do not skip without the portable runtime.
      - name: Run Python tests
        shell: bash
        run: |
          uv run --no-sync python -m compileall main.py config core gui utils _mext build.py tests resources/vapoursynth/python
          uv run --no-sync python -m unittest discover -s tests -p "test_*.py"

      - name: Install Inno Setup
        if: inputs.build_installer == true
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build with cx_Freeze
        shell: pwsh
        run: |
          $buildArgs = @()
          if ("${{ inputs.skip_flasher }}" -eq "true") { $buildArgs += "--skip-flasher" }
          if ("${{ inputs.obfuscate }}" -eq "true") { $buildArgs += "--obfuscate" }
          if ("${{ inputs.build_installer }}" -ne "true") { $buildArgs += "--no-installer" }
          if ("${{ inputs.upload_artifact }}" -ne "true") { $buildArgs += "--no-portable" }
          uv run --no-sync python build.py @buildArgs
        env:
          # qfluentwidgets 等第三方库触发的 SyntaxWarning
          PYTHONWARNINGS: "ignore::SyntaxWarning"

      - name: Verify frozen VapourSynth worker pipe
        shell: pwsh
        run: |
          $requiredArtifacts = @(
            "ArknightsPassMaker/vs_worker.exe",
            "ArknightsPassMaker/config/vs_runtime.json",
            "ArknightsPassMaker/tools/media/vapoursynth.pyd",
            "ArknightsPassMaker/tools/media/vapoursynth.dll",
            "ArknightsPassMaker/tools/media/portable.vs",
            "ArknightsPassMaker/tools/media/vs-plugins/LSMASHSource.dll",
            "ArknightsPassMaker/tools/media/vs-plugins/libimwri.dll",
            "ArknightsPassMaker/resources/vapoursynth/assetmaker_runner.vpy",
            "ArknightsPassMaker/resources/vapoursynth/default_pipeline.vpy",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/__init__.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/job_api.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/script_header.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/executor.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/contract.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/display.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/runtime_fingerprint.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/core_resources.py",
            "ArknightsPassMaker/resources/vapoursynth/python/assetmaker_vs/native_plugins.py"
          )
          foreach ($artifact in $requiredArtifacts) {
            if (-not (Test-Path $artifact)) {
              Write-Error "Required frozen artifact not found: $artifact"
              exit 1
            }
          }
          $retiredArtifacts = @(
            "ArknightsPassMaker/config/vsconfig.json",
            "ArknightsPassMaker/lib/core/vs_graph.pyc",
            "ArknightsPassMaker/lib/core/vs_script.pyc",
            "ArknightsPassMaker/lib/core/vs_engine.pyc",
            "ArknightsPassMaker/lib/core/vs_player.pyc",
            "ArknightsPassMaker/lib/core/vs_frame.pyc",
            "ArknightsPassMaker/lib/config/vsconfig.pyc"
          )
          foreach ($artifact in $retiredArtifacts) {
            if (Test-Path $artifact) {
              Write-Error "旧 VS 文件被分发: $artifact"
              exit 1
            }
          }
          Write-Host "Running vs_worker.exe --self-test through WorkerProcess..."
          $code = @'
          from pathlib import Path
          from core.vs_runtime.worker_process import SyncVSWorkerProcess

          root = Path("ArknightsPassMaker").resolve()
          worker = (root / "vs_worker.exe").resolve()
          client = SyncVSWorkerProcess(
              app_dir=root, command=[str(worker)], self_test=True
          )
          try:
              ready = client.start(timeout_ms=15_000)
              assert ready["operation"] == "hello"
              unicode_logs = [
                  message
                  for _level, message in client.logs
                  if "中文自测" in message
              ]
              assert any(len(message) > 65_536 for message in unicode_logs)
              stopped = client.shutdown(timeout_ms=10_000)
              assert stopped["operation"] == "shutdown"
              assert client.wait(timeout_ms=10_000) == 0
          finally:
              client.close()
          print("Frozen worker binary PIPE/Unicode/exit-0 self-test OK")
          '@
          uv run --no-sync python -c $code

      - name: Verify portable archive
        if: inputs.upload_artifact == true
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem "dist" -Filter "*-windows-portable.zip" -File)
          if ($archives.Count -ne 1) {
            Write-Error "Expected exactly one portable archive, found $($archives.Count)"
            exit 1
          }
          $portableSmoke = Join-Path $env:RUNNER_TEMP "portable-smoke-$([guid]::NewGuid())"
          Expand-Archive -LiteralPath $archives[0].FullName -DestinationPath $portableSmoke
          $requiredPortableArtifacts = @(
            "ArknightsPassMaker/ArknightsPassMaker.exe",
            "ArknightsPassMaker/vs_worker.exe",
            "ArknightsPassMaker/config/vs_runtime.json",
            "ArknightsPassMaker/tools/media/portable.vs",
            "ArknightsPassMaker/resources/vapoursynth/default_pipeline.vpy"
          )
          foreach ($artifact in $requiredPortableArtifacts) {
            if (-not (Test-Path (Join-Path $portableSmoke $artifact))) {
              Write-Error "Required portable artifact not found: $artifact"
              exit 1
            }
          }
          Write-Host "Portable archive extraction smoke test OK"

      - name: Debug exe outputs
        shell: pwsh
        run: |
          Write-Host "==== dist contents ===="
          if (Test-Path "dist") {
            Get-ChildItem -Recurse "dist" | Select-Object FullName, Length
          } else {
            Write-Host "dist directory not found"
          }
          Write-Host "==== cx_Freeze contents ===="
          if (Test-Path "ArknightsPassMaker") {
            Get-ChildItem -Recurse "ArknightsPassMaker" -Filter *.exe | Select-Object FullName, Length
          } else {
            Write-Host "ArknightsPassMaker directory not found"
          }
      
      - name: Upload build artifact
        if: inputs.upload_artifact == true
        uses: actions/upload-artifact@v4
        with:
          name: ArknightsPassMaker-Build
          path: |
            dist/*.exe
            dist/*-windows-portable.zip
          if-no-files-found: error
          # EXE 与 ZIP 已分别压缩；再次进行 zlib 压缩只会拖慢上传。
          compression-level: 0

      - name: Expose artifact run ID
        if: inputs.upload_artifact == true
        id: expose-run-id
        shell: pwsh
        run: |
          "artifact_run_id=${{ github.run_id }}" >> $env:GITHUB_OUTPUT
